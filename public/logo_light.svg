    <circle cx="22" cy="5" r="4"/>
    <line x1="22" y1="9" x2="22" y2="20" stroke="#E85D04" stroke-width="3"/>
    <line x1="22" y1="13" x2="34" y2="13" stroke="#E85D04" stroke-width="2"/>
    <line x1="22" y1="20" x2="17" y2="30" stroke="#E85D04" stroke-width="2.5"/>
    <line x1="22" y1="20" x2="27" y2="30" stroke="#E85D04" stroke-width="2.5"/>

    <circle cx="34" cy="5" r="4"/>
    <line x1="34" y1="9" x2="34" y2="20" stroke="#E85D04" stroke-width="3"/>
    <line x1="34" y1="13" x2="46" y2="13" stroke="#E85D04" stroke-width="2"/>
    <line x1="34" y1="20" x2="29" y2="30" stroke="#E85D04" stroke-width="2.5"/>
    <line x1="34" y1="20" x2="39" y2="30" stroke="#E85D04" stroke-width="2.5"/>

    <circle cx="46" cy="5" r="4"/>
    <line x1="46" y1="9" x2="46" y2="20" stroke="#E85D04" stroke-width="3"/>
    <line x1="46" y1="20" x2="41" y2="30" stroke="#E85D04" stroke-width="2.5"/>
    <line x1="46" y1="20" x2="51" y2="30" stroke="#E85D04" stroke-width="2.5"/>

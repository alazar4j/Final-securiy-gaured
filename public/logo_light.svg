    <rect x="135" y="170" width="16" height="16" stroke-width="3"/>
    <line x1="143" y1="170" x2="143" y2="186" stroke-width="2"/>
    <line x1="135" y1="178" x2="151" y2="178" stroke-width="2"/>
    <rect x="185" y="170" width="16" height="16" stroke-width="3"/>
    <line x1="193" y1="170" x2="193" y2="186" stroke-width="2"/>
    <line x1="185" y1="178" x2="201" y2="178" stroke-width="2"/>
  </g>

  <!-- Quadrant 2 (Top-Right): Family -->
  <g stroke="#E85D04" stroke-width="3.5" fill="none" stroke-linecap="round">
    <circle cx="285" cy="120" r="8"/>
    <path d="M 285 128 L 285 165 M 285 140 L 270 155 M 285 140 L 305 145 M 285 165 L 275 200 M 285 165 L 295 200"/>
    <circle cx="320" cy="122" r="8"/>
    <path d="M 320 130 L 310 165 L 330 165 Z M 305 145 L 320 140 M 320 140 L 335 155 M 315 165 L 312 200 M 325 165 L 328 200"/>
    <circle cx="350" cy="140" r="6"/>
    <path d="M 350 146 L 350 175 M 335 155 L 350 155 M 350 155 L 360 165 M 350 175 L 344 200 M 350 175 L 356 200"/>
  </g>

  <!-- Quadrant 3 (Bottom-Left): Tools -->
  <g stroke="#E85D04" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 115 285 L 155 285 L 155 390 L 135 390 L 135 305 L 115 305 Z"/>
    <path d="M 165 295 L 210 295 L 210 380 L 190 380 L 190 315 L 165 315 Z"/>
    <circle cx="178" cy="345" r="8" fill="none" stroke-width="3"/>
  </g>

  <!-- Quadrant 4 (Bottom-Right): Equipment & Tech -->
  <g stroke="#E85D04" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 280 300 L 310 285 L 340 300 L 340 330 L 310 345 L 280 330 Z"/>
    <path d="M 310 285 L 310 345 M 340 300 L 310 315 L 280 300"/>
    <path d="M 330 355 C 310 355, 300 380, 320 400 C 340 420, 370 380, 350 350"/>
    <circle cx="320" cy="380" r="14" stroke-width="3"/>
  </g>
</svg>

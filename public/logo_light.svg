  <!-- Top Arc Amharic Text -->
  <text font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', sans-serif" font-weight="bold" font-size="20" fill="#E85D04">
    <textPath href="#topArcLight" startOffset="50%" text-anchor="middle">
      በሰላም የሕፃናት መንደር ሰላም የቴክኒክና ሙያ ኮሌጅ
    </textPath>
  </text>

  <!-- Bottom Arc English Text -->
  <text font-family="sans-serif" font-weight="bold" font-size="15" fill="#E85D04">
    <textPath href="#bottomArcLight" startOffset="50%" text-anchor="middle">
      Selam Children's village
    </textPath>
  </text>
  <text font-family="sans-serif" font-weight="bold" font-size="17" fill="#E85D04">
    <textPath href="#bottomOuterArcLight" startOffset="50%" text-anchor="middle">

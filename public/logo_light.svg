    <rect x="238" y="10" width="24" height="24" rx="4" transform="rotate(90 250 250)"/>
    <rect x="238" y="10" width="24" height="24" rx="4" transform="rotate(108 250 250)"/>
    <rect x="238" y="10" width="24" height="24" rx="4" transform="rotate(126 250 250)"/>
    <rect x="238" y="10" width="24" height="24" rx="4" transform="rotate(144 250 250)"/>
    <rect x="238" y="10" width="24" height="24" rx="4" transform="rotate(162 250 250)"/>
